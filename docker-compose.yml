version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # These overrides ensure the app connects to the containers, not localhost
      - REDIS_URL=redis://redis:6379/0
      - MYSQL_HOST=db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zkvault_net

  db:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    environment:
      # If your .env doesn't set a root password, this is a fallback for initialization
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-secure_vault}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - zkvault_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - zkvault_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  zkvault_net:

volumes:
  db_data:
  redis_data:
