<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code }} — ZK Vault</title>
    <meta name="description" content="Zero-knowledge encrypted vault — your data never leaves your device unencrypted.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="bg-grid"></div>
    <main>
        <div class="auth-layout">
            <div class="error-card auth-card">
                <div class="error-code">{{ code }}</div>
                <h2>{{ title }}</h2>
                <p>{{ message }}</p>
                <a href="{{ url_for('login') }}" class="btn primary">Return Home</a>
            </div>
        </div>
    </main>
</body>
</html>
