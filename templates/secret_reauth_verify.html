{% extends "base.html" %}

{% block title %}Verify Re‑authentication — ZK Vault{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="auth-card">
        <div class="card-icon">◈</div>
        <h2>Verify OTP</h2>
        <p class="card-subtitle">Enter the 6‑digit code sent to your email to re‑authenticate.</p>

        <form method="post" action="{{ url_for('secret_reauth_verify') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="otp">Verification Code</label>
                <input type="text" id="otp" name="otp" class="otp-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
            </div>
            <button type="submit" class="btn primary btn-full">Verify</button>
        </form>
    </div>
</div>
{% endblock %}
