{% extends "base.html" %}

{% block title %}Verify Email — ZK Vault{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="auth-card">
        <div class="card-icon">◈</div>
        <h2>Verify Email</h2>
        <p class="card-subtitle">We sent a 6‑digit code to <strong>{{ email }}</strong>.</p>

        <form id="verify-signup-form" method="post" action="{{ url_for('verify_signup_otp') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="form-group">
                <label for="otp">Verification Code</label>
                <input type="text" id="otp" name="otp" class="otp-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
            </div>
            <button type="submit" class="btn primary btn-full">Verify</button>
        </form>
        <p class="text-link"><a href="{{ url_for('signup') }}">← Start over</a></p>
    </div>
</div>
{% endblock %}
