{% extends "base.html" %}

{% block title %}Unlock Secret Vault — ZK Vault{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="auth-card">
        <div class="card-icon lock-pulse">●</div>
        <h2>Unlock Secret Vault</h2>
        <p class="card-subtitle">Enter your secret code to decrypt your protected records.</p>

        <form id="secret-unlock-form">
            <div class="form-group">
                <label for="secret-code">Secret Code</label>
                <input type="text" id="secret-code" placeholder="Enter secret code" required autofocus>
            </div>
            <button type="submit" class="btn primary btn-full">Unlock</button>
        </form>
        <div id="status" class="status"></div>
        <p class="text-link"><a href="{{ url_for('home') }}">← Back to main vault</a></p>
    </div>
</div>
{% endblock %}
