{% extends "base.html" %}

{% block title %}Re‑authenticate — ZK Vault{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="auth-card">
        <div class="card-icon warning-icon">⚠</div>
        <h2>Re‑authenticate</h2>
        <div class="confirm-warning">
            Too many failed secret vault attempts detected. You must verify your identity via email OTP before retrying.
        </div>

        <form method="post" action="{{ url_for('secret_reauth') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn primary btn-full">Send OTP to Email</button>
        </form>
        <p class="text-link"><a href="{{ url_for('home') }}">← Cancel</a></p>
    </div>
</div>
{% endblock %}
